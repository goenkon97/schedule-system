# =====================================================================
# application-demo.properties：「演示模式」的配置（上线到 Render 时用）
#
# Spring Boot 的「配置档」（profile）是怎么回事：
#   application.properties       → 永远会读（公共设置）
#   application-demo.properties  → 只有「demo 这个配置档被打开」时才读，而且同名的设置会盖掉上面那份
#   怎么打开：启动时设环境变量 SPRING_PROFILES_ACTIVE=demo（我们写在 Dockerfile 里了）
#   本地开发不设这个环境变量，所以还是连你电脑上 Docker 里的 MySQL，什么都不变。
#
# 这里只写「和平时不一样」的几行，其余（端口、JWT 等）照用 application.properties 里的。
# =====================================================================

# ---------- 数据库：换成内存里的 H2 ----------
# jdbc:h2:mem:schedule → 用 H2，数据库开在内存（mem）里，名字叫 schedule
# 分号后面是几个附加设置：
#   DB_CLOSE_DELAY=-1   → 程序活着的期间数据库一直在（默认是「最后一个连接断开就清空」，那样会莫名其妙丢数据）
#   MODE=MySQL          → 尽量模仿 MySQL 的行为，和本地开发时更接近
#   NON_KEYWORDS=YEAR,MONTH → 在 H2 里 YEAR、MONTH 是「保留字」（SQL 自己要用的词），
#                         而我们的 schedules 表正好有叫 year、month 的列；告诉 H2 把它们当普通名字，否则建表会报错
spring.datasource.url=jdbc:h2:mem:schedule;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH
# H2 的默认账号是 sa、密码为空。数据库只在这个程序的内存里，外面根本连不进来，所以不需要真密码
spring.datasource.username=sa
spring.datasource.password=
# 明确写出用哪个驱动（不写 Spring 也能从 URL 猜出来，写出来一眼看清楚）
spring.datasource.driver-class-name=org.h2.Driver

# ---------- 日志：线上不打印每一条 SQL ----------
# 本地学习时打开 show-sql 是为了看 Hibernate 生成了什么 SQL；线上打印太多，日志难看，也稍微拖慢速度
spring.jpa.show-sql=false
