# =====================================================================
# application.properties：Spring Boot 的配置文件
#
# 格式：一行一个设置，「名字=值」；# 开头的是注释。
# Spring Boot 启动时会自动读这个文件（它放在 src/main/resources 下面，
# 编译后会被复制进 jar 包里，所以不用告诉 Spring 去哪里找它）。
#
# ${名字:默认值} 的写法：先去找同名的「环境变量」，找到就用环境变量的值，找不到才用冒号后面的默认值。
#   本地开发：不设环境变量，直接用默认值（就是我们 docker run 时设的账号密码），省事
#   上线时：在服务器上设置环境变量 DB_PASSWORD=真正的密码，代码和这个文件一行都不用改，
#           真正的密码也不会出现在 GitHub 上
# =====================================================================

# 程序的名字（会显示在启动日志里）
spring.application.name=schedule-backend

# ---------- Web 服务器 ----------
# 内置的 Tomcat 在哪个端口上等请求。8080 是 Spring Boot 的默认值，写出来是为了一眼看清楚。
# 前端（5173）会把请求发到这个端口。
server.port=${PORT:8080}

# ---------- 数据库连接 ----------
# JDBC URL：告诉 Java「去哪里找数据库」，格式是 jdbc:数据库类型://主机:端口/数据库名
#   jdbc:mysql → 用 MySQL 驱动（pom.xml 里的 mysql-connector-j）
#   localhost:3306 → 你自己的电脑的 3306 端口（docker run 时用 -p 3306:3306 把容器里的 MySQL 接到这里）
#   /schedule → 用 schedule 这个数据库（docker run 时用 MYSQL_DATABASE=schedule 建好的）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/schedule}
# 登录 MySQL 的账号和密码（docker run 时用 MYSQL_USER / MYSQL_PASSWORD 建的普通账号，不用 root）
spring.datasource.username=${DB_USERNAME:schedule}
spring.datasource.password=${DB_PASSWORD:schedule1234}

# ---------- JPA / Hibernate ----------
# 启动时怎么处理数据库的表结构：
#   update → 对比 Java 的 Entity 类和数据库里的表，缺什么表、缺什么列就自动加上（不会删数据）
# 学习阶段用 update 最方便：写好一个 Entity 类，启动程序表就自动建好了。
# 注意：公司的正式项目不会这样用（改名、删列它处理不了，也没有变更记录），
#       而是用 Flyway 这种「数据库迁移」工具，一个 SQL 文件记录一次表结构变化。以后我们也会换成它。
spring.jpa.hibernate.ddl-auto=update

# 在启动日志里打印 Hibernate 自动生成的每一条 SQL。
# 学习时打开：能亲眼看到「调用 save() → 实际执行了 insert into ...」
spring.jpa.show-sql=true
# 打印 SQL 时自动换行、缩进，更好读
spring.jpa.properties.hibernate.format_sql=true

# 关掉 open-in-view（Spring Boot 默认是开着的，启动时会打一条警告提醒你）。
# 开着的时候，数据库连接会一直占用到整个请求（包括把 JSON 写回浏览器）结束；
# 关掉以后，数据库只在 Service 里真正查询时才用，用完马上还给连接池，
# 这也逼着我们在 Service 里把需要的数据都查好，代码的分层更清楚。
spring.jpa.open-in-view=false
